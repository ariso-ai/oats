name: Desktop App

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# Signing, notarization, and publishing live in release.yaml; this workflow is
# CI validation only, so superseded runs are safe to cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    # Keep frontend and host validation under one cross-platform contract. The
    # matrix proves each native implementation builds; release signing and
    # installer publication deliberately remain outside pull-request CI.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    # macos-15 is a GitHub-hosted Apple Silicon (arm64) runner; macos-13 is Intel.
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          cache: 'npm'
          node-version: '24'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        if: runner.os == 'macOS'
        with:
          targets: aarch64-apple-darwin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        if: runner.os == 'Windows'

      - name: Cache Rust dependencies
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8  # v6.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build frontend
        run: npm run vite:build

      # The sidecar artifacts (Metal/MLX) are toolchain-specific, and this cache
      # is shared with release.yaml's signed build. Key it on the Xcode toolchain
      # so a sidecar built by one runner's Xcode is never restored into another's
      # — e.g. this GitHub-hosted macos-15 build vs release.yaml's self-hosted Mac.
      - name: Fingerprint Xcode toolchain
        if: runner.os == 'macOS'
        id: toolchain
        run: echo "fp=$(xcodebuild -version | tr '\n ' '-_')" >> "$GITHUB_OUTPUT"

      # The ariso-stt Swift sidecar is a build artifact (not committed) that
      # tauri's `externalBin` requires to exist before `cargo build`. It lives
      # under the gitignored binaries/ dir. Building it compiles the heavy MLX
      # dependency tree from scratch (~25 min), but its inputs — Package.resolved
      # and Sources/ — rarely change, so cache the produced artifacts keyed on
      # their hash (plus the toolchain fingerprint) and skip the build on a hit.
      # Exact-match key only (no restore-keys): a partial restore would yield
      # artifacts that don't match the current source or toolchain.
      - name: Cache ariso-stt sidecar artifacts
        if: runner.os == 'macOS'
        id: sidecar-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8  # v6.0.0
        with:
          path: |
            src-tauri/binaries/ariso-stt-aarch64-apple-darwin
            src-tauri/binaries/mlx-swift_Cmlx.bundle
          key: ariso-stt-aarch64-${{ steps.toolchain.outputs.fp }}-${{ hashFiles('src-tauri/ariso-stt/macos/Package.resolved', 'src-tauri/ariso-stt/macos/Sources/**') }}

      # On a cache miss, build once with xcodebuild. It emits both the
      # executable and the MLX metallib bundle (mlx-swift_Cmlx.bundle, referenced
      # by tauri.conf.json's bundle.resources) into Build/Products/Release. A
      # separate `swift build` is redundant — `swift build` can't compile MLX's
      # Metal shaders anyway, and xcodebuild's executable already expects the
      # metallib bundle beside it — so build once and copy both products out.
      - name: Build ariso-stt sidecar
        if: runner.os == 'macOS' && steps.sidecar-cache.outputs.cache-hit != 'true'
        working-directory: src-tauri/ariso-stt/macos
        run: |
          mkdir -p ../../binaries
          xcodebuild build -scheme ariso-stt -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .xcode -skipMacroValidation
          cp .xcode/Build/Products/Release/ariso-stt ../../binaries/ariso-stt-aarch64-apple-darwin
          cp -R .xcode/Build/Products/Release/mlx-swift_Cmlx.bundle ../../binaries/

      - name: Fingerprint Windows Rust toolchain
        if: runner.os == 'Windows'
        id: windows-toolchain
        shell: pwsh
        run: |
          $version = (rustc --version).Replace(' ', '-')
          "version=$version" >> $env:GITHUB_OUTPUT

      # The host build only consumes the staged executable and llama runtime.
      # Cache those exact externalBin/resources outputs, keyed by every script,
      # source, and lock input that can change their bytes.
      - name: Cache Windows ariso-stt sidecar artifacts
        if: runner.os == 'Windows'
        id: windows-sidecar-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8  # v6.0.0
        with:
          path: |
            src-tauri/binaries/ariso-stt-x86_64-pc-windows-msvc.exe
            src-tauri/binaries/llama
          key: ariso-stt-windows-x64-${{ steps.windows-toolchain.outputs.version }}-${{ hashFiles('src-tauri/ariso-stt/windows/Cargo.lock', 'src-tauri/ariso-stt/windows/Cargo.toml', 'src-tauri/ariso-stt/windows/src/**', 'src-tauri/ariso-stt/shared/**', 'scripts/build-windows-sidecar.ps1', 'scripts/prepare-windows-llama-runtime.ps1', 'scripts/import-windows-build-env.ps1') }}

      # Exercise the sidecar's shared CLI/JSON contract before its release
      # binary is copied into Tauri's externalBin location.
      - name: Test Windows ariso-stt sidecar
        if: runner.os == 'Windows' && steps.windows-sidecar-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          . ./scripts/import-windows-build-env.ps1
          Import-WindowsBuildEnvironment
          cargo test --manifest-path src-tauri/ariso-stt/windows/Cargo.toml --locked

      # The following host build expects the target-suffixed external binary to
      # exist even though CI is not producing an installer.
      - name: Build Windows ariso-stt sidecar
        if: runner.os == 'Windows' && steps.windows-sidecar-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-windows-sidecar.ps1

      - name: Build Rust
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: cargo build --locked

      - name: Build Rust
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ./scripts/import-windows-build-env.ps1
          Import-WindowsBuildEnvironment
          cargo build --manifest-path src-tauri/Cargo.toml --locked
