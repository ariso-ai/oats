name: E2E Smoke

# Drives the LIVE app (a Tauri dev build plus tauri-plugin-mcp's socket) on macOS
# and Windows, and asserts it boots, answers a backend invoke, and opens and
# renders the Meetings window. This is the regression gate for the
# autonomous-refactor workflow (see issue: "Autonomous refactoring in CI, gated by
# an E2E smoke test"), so the checks are deterministic — no LLM in the loop, and a
# red run means the app broke.
#
# It is intentionally audio/TCC-free and hermetic — no recording, no transcription
# — so it runs on GitHub-hosted runners. The full record->transcribe tier is a
# separate, self-hosted follow-up.
#
# The whole run (launch, wait, assert, tear down) lives in scripts/e2e-smoke.mjs
# so the two platforms share one implementation instead of a bash copy and a
# PowerShell copy, and so `npm run e2e:smoke` reproduces a red build locally.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            sidecar: src-tauri/binaries/ariso-stt-aarch64-apple-darwin
          - os: windows-latest
            sidecar: src-tauri/binaries/ariso-stt-x86_64-pc-windows-msvc.exe
    # macos-15 is a GitHub-hosted Apple Silicon (arm64) runner.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          cache: 'npm'
          node-version: '24'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        if: runner.os == 'macOS'
        with:
          targets: aarch64-apple-darwin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        if: runner.os == 'Windows'

      # Same key as desktop.yaml so both workflows share one registry cache.
      # `src-tauri/target` is deliberately not cached: the debug tree runs to
      # several GB, which alone would blow the repo's cache quota and evict the
      # sidecar entries that are actually worth minutes.
      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline

      # The ariso-stt sidecar is a gitignored build artifact that tauri's
      # `externalBin` requires to exist before any cargo build, `tauri dev`
      # included. The smoke test never executes it (no transcription), but the
      # build won't start without it — so restore it from the cache desktop.yaml
      # and release.yaml already populate, keyed identically so the entry is
      # shared rather than forked.
      - name: Fingerprint Xcode toolchain
        if: runner.os == 'macOS'
        id: toolchain
        run: echo "fp=$(xcodebuild -version | tr '\n ' '-_')" >> "$GITHUB_OUTPUT"

      - name: Cache ariso-stt sidecar artifacts
        if: runner.os == 'macOS'
        id: sidecar-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            src-tauri/binaries/ariso-stt-aarch64-apple-darwin
            src-tauri/binaries/mlx-swift_Cmlx.bundle
          key: ariso-stt-aarch64-${{ steps.toolchain.outputs.fp }}-${{ hashFiles('src-tauri/ariso-stt/macos/Package.resolved', 'src-tauri/ariso-stt/macos/Sources/**') }}

      - name: Build ariso-stt sidecar
        if: runner.os == 'macOS' && steps.sidecar-cache.outputs.cache-hit != 'true'
        working-directory: src-tauri/ariso-stt/macos
        run: |
          mkdir -p ../../binaries
          xcodebuild build -scheme ariso-stt -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .xcode -skipMacroValidation
          cp .xcode/Build/Products/Release/ariso-stt ../../binaries/ariso-stt-aarch64-apple-darwin
          cp -R .xcode/Build/Products/Release/mlx-swift_Cmlx.bundle ../../binaries/

      - name: Fingerprint Windows Rust toolchain
        if: runner.os == 'Windows'
        id: windows-toolchain
        shell: pwsh
        run: |
          $version = (rustc --version).Replace(' ', '-')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Cache Windows ariso-stt sidecar artifacts
        if: runner.os == 'Windows'
        id: windows-sidecar-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            src-tauri/binaries/ariso-stt-x86_64-pc-windows-msvc.exe
            src-tauri/binaries/llama
            src-tauri/binaries/windows-runtime
          key: ariso-stt-windows-x64-${{ steps.windows-toolchain.outputs.version }}-${{ hashFiles('src-tauri/ariso-stt/windows/Cargo.lock', 'src-tauri/ariso-stt/windows/Cargo.toml', 'src-tauri/ariso-stt/windows/src/**', 'src-tauri/ariso-stt/shared/**', 'scripts/build-windows-sidecar.ps1', 'scripts/prepare-windows-llama-runtime.ps1', 'scripts/prepare-windows-vc-runtime.ps1', 'scripts/import-windows-build-env.ps1') }}

      - name: Build Windows ariso-stt sidecar
        if: runner.os == 'Windows' && steps.windows-sidecar-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-windows-sidecar.ps1

      # Fail here rather than inside the smoke run, where a missing externalBin
      # surfaces as an opaque tauri dev compile error.
      - name: Verify sidecar is staged
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "${{ matrix.sidecar }}" -PathType Leaf)) {
            throw "Expected ${{ matrix.sidecar }} to exist before tauri dev; the sidecar cache and build both failed."
          }

      # One step, one script, both platforms. Its exit code is the gate.
      - name: Run smoke
        run: npm run e2e:smoke
        env:
          E2E_ARTIFACT_DIR: e2e-artifacts

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: e2e-smoke-diagnostics-${{ matrix.os }}
          path: e2e-artifacts/
          if-no-files-found: warn
          retention-days: 7
