name: Temporary PR 282 Windows installer build

on:
  push:
    branches:
      - codex/pr-282-artifact-67f1258

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: npm
          node-version: "24"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Fingerprint Windows Rust toolchain
        id: windows-toolchain
        shell: pwsh
        run: |
          $version = (rustc --version).Replace(' ', '-')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Cache Windows sidecar and executable resources
        id: windows-sidecar-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            src-tauri/binaries/ariso-stt-x86_64-pc-windows-msvc.exe
            src-tauri/binaries/llama
            src-tauri/binaries/windows-runtime
          key: ariso-stt-windows-x64-${{ steps.windows-toolchain.outputs.version }}-${{ hashFiles('src-tauri/ariso-stt/windows/Cargo.lock', 'src-tauri/ariso-stt/windows/Cargo.toml', 'src-tauri/ariso-stt/windows/src/**', 'src-tauri/ariso-stt/shared/**', 'scripts/build-windows-sidecar.ps1', 'scripts/prepare-windows-llama-runtime.ps1', 'scripts/prepare-windows-vc-runtime.ps1', 'scripts/import-windows-build-env.ps1') }}

      - name: Build Windows sidecar and executable resources
        if: steps.windows-sidecar-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-windows-sidecar.ps1

      - name: Verify staged app-local runtime
        shell: pwsh
        run: |
          ./scripts/verify-windows-vc-runtime.ps1 `
            -RootRuntimeDirectory src-tauri/binaries/windows-runtime `
            -LlamaRuntimeDirectory src-tauri/binaries/llama `
            -SidecarPath src-tauri/binaries/ariso-stt-x86_64-pc-windows-msvc.exe `
            -LlamaServerPath src-tauri/binaries/llama/llama-server.exe

      - name: Cache Windows Rust release dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/x86_64-pc-windows-msvc
          key: oats-windows-x64-${{ steps.windows-toolchain.outputs.version }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/build.rs', 'src-tauri/src/**', 'src-tauri/tauri*.json', 'src-tauri/capabilities/**') }}
          restore-keys: |
            oats-windows-x64-${{ steps.windows-toolchain.outputs.version }}-

      - name: Build unsigned NSIS and MSI installers
        shell: pwsh
        run: |
          ./scripts/build-windows-installers.ps1 `
            -Bundles nsis,msi `
            -Target x86_64-pc-windows-msvc

      - name: Verify installer payloads
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter *.exe -File)
          $msi = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi -Filter *.msi -File)
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) {
            throw "Expected one NSIS and one MSI; found NSIS=$($nsis.Count), MSI=$($msi.Count)."
          }
          ./scripts/verify-windows-installer-runtime.ps1 `
            -NsisInstallerPath $nsis[0].FullName `
            -MsiInstallerPath $msi[0].FullName

      - name: Upload Windows installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-282-windows-installers-67f1258
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
