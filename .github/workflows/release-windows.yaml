name: Release (Windows)

# Windows packaging is deliberately its own workflow rather than a set of jobs
# in release.yaml: eSigner/Authenticode is the flakiest link in the release
# chain, and when it breaks it must not hold back a macOS build that already
# signed and notarized. Keeping it separate also makes it re-runnable on its
# own against any tag, which is how you debug a signing failure without cutting
# a throwaway release.
#
# Triggered by the `dispatch-windows` job in release.yaml. workflow_dispatch is
# one of the two events the default GITHUB_TOKEN is still allowed to trigger, so
# no PAT is needed. Dispatch it by hand for a re-run:
#
#   gh workflow run release-windows.yaml --ref main -f tag=v0.18.0
#   gh workflow run release-windows.yaml --ref main -f tag=v0.18.0 -f skip_publish=true
#   gh workflow run release-windows.yaml --ref main -f tag=v0.18.0 -f sign=false
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v0.18.0)'
        required: true
        type: string
      # `tag` still names the release and the R2 path; `ref` only decides which
      # source is built. They are separate because --ref selects this workflow
      # FILE while the checkout below selects the SCRIPTS, so without this a run
      # could only ever test signing code that was already tagged.
      ref:
        description: 'Source ref to build (branch, tag or SHA). Defaults to `tag`.'
        required: false
        default: ''
        type: string
      skip_publish:
        description: 'Dry run: build, sign and verify only — do not upload to R2 or edit the GitHub Release'
        required: false
        default: false
        type: boolean
      sign:
        description: 'Authenticode-sign the installers with SSL.com eSigner. Turn OFF only to ship an emergency unsigned build when eSigner is down.'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Never cancel an in-flight run — it may be mid-eSigner-session — but do not let
# two runs race on the same R2 objects either.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # The default packaging path. It and the unsigned `package-windows` job below
  # are mutually exclusive on `inputs.sign` and upload the SAME artifact name,
  # so `sign-windows-updater` consumes whichever one ran without caring which.
  package-windows-authenticode:
    name: Build and Authenticode-sign x64 NSIS and MSI installers
    if: ${{ inputs.sign }}
    runs-on: windows-latest
    # SSL.com credentials are isolated from Apple/R2/updater-key credentials.
    # In particular, this job cannot produce a Tauri .sig before Authenticode.
    environment: windows-release
    permissions:
      contents: read
    steps:
      # `tag` is free-form dispatch input that becomes a checkout ref and, later,
      # an R2 path component. Reject anything that is not a release tag before it
      # reaches either.
      - name: Validate release tag input
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]]; then
            echo "Refusing to build '$TAG': expected a release tag like v0.18.0." >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          cache: 'npm'
          node-version: '24'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Fingerprint Windows Rust toolchain
        id: windows-toolchain
        shell: pwsh
        run: |
          $version = (rustc --version).Replace(' ', '-')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Cache Windows sidecar and executable resources
        id: windows-sidecar-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            src-tauri/binaries/ariso-stt-x86_64-pc-windows-msvc.exe
            src-tauri/binaries/llama
            src-tauri/binaries/windows-runtime
          key: ariso-stt-windows-x64-${{ steps.windows-toolchain.outputs.version }}-${{ hashFiles('src-tauri/ariso-stt/windows/Cargo.lock', 'src-tauri/ariso-stt/windows/Cargo.toml', 'src-tauri/ariso-stt/windows/src/**', 'src-tauri/ariso-stt/shared/**', 'scripts/build-windows-sidecar.ps1', 'scripts/prepare-windows-llama-runtime.ps1', 'scripts/prepare-windows-vc-runtime.ps1', 'scripts/import-windows-build-env.ps1') }}

      - name: Build Windows sidecar and executable resources
        if: steps.windows-sidecar-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-windows-sidecar.ps1

      - name: Verify app-local Visual C++ runtime
        shell: pwsh
        run: |
          ./scripts/verify-windows-vc-runtime.ps1 `
            -RootRuntimeDirectory src-tauri/binaries/windows-runtime `
            -LlamaRuntimeDirectory src-tauri/binaries/llama `
            -SidecarPath src-tauri/binaries/ariso-stt-x86_64-pc-windows-msvc.exe `
            -LlamaServerPath src-tauri/binaries/llama/llama-server.exe

      # Pin the reviewed SSL.com action. This invocation only installs and
      # configures CodeSignTool; Tauri calls our secret-safe wrapper once for
      # every binary through bundle.windows.signCommand.
      - name: Set up SSL.com eSigner CodeSignTool
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b  # v1.3.2
        with:
          command: --version
          environment_name: PROD
          signing_method: v2

      - name: Create Tauri remote-signing overlay
        shell: pwsh
        run: |
          $signer = (Resolve-Path scripts/sign-windows-artifact.ps1).Path
          $configPath = Join-Path $env:RUNNER_TEMP "tauri.windows-release.json"
          $auditPath = Join-Path $env:RUNNER_TEMP "oats-windows-signing-audit.jsonl"
          $diagnosticPath = Join-Path $env:RUNNER_TEMP "oats-windows-signing-diagnostic.log"
          $config = [ordered]@{
            bundle = [ordered]@{
              targets = @("nsis", "msi")
              createUpdaterArtifacts = $false
              windows = [ordered]@{
                signCommand = [ordered]@{
                  cmd = "pwsh.exe"
                  args = @(
                    "-NoLogo",
                    "-NoProfile",
                    "-NonInteractive",
                    "-ExecutionPolicy",
                    "Bypass",
                    "-File",
                    $signer,
                    "%1"
                  )
                }
              }
            }
          }
          $config | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $configPath -Encoding utf8
          "TAURI_WINDOWS_RELEASE_CONFIG=$configPath" >> $env:GITHUB_ENV
          "OATS_SIGNING_AUDIT_PATH=$auditPath" >> $env:GITHUB_ENV
          "OATS_SIGNING_DIAGNOSTIC_PATH=$diagnosticPath" >> $env:GITHUB_ENV

      # One disposable PE, one eSigner session: surfaces bad credentials, a TOTP
      # drift or an expired certificate in about a minute instead of after the
      # ~30-minute Tauri build. Deleted immediately so it cannot be mistaken for
      # a bundled sidecar.
      - name: Preflight eSigner on a disposable sidecar copy
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ vars.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          $copy = "src-tauri/binaries/ariso-stt-signing-preflight.exe"
          Copy-Item `
            -LiteralPath src-tauri/binaries/ariso-stt-x86_64-pc-windows-msvc.exe `
            -Destination $copy -Force
          try {
            ./scripts/sign-windows-artifact.ps1 -FilePath $copy
          } finally {
            Remove-Item -LiteralPath $copy -Force -ErrorAction SilentlyContinue
          }

      - name: Cache Windows Rust release dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/x86_64-pc-windows-msvc
          key: oats-windows-x64-${{ steps.windows-toolchain.outputs.version }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/build.rs', 'src-tauri/src/**', 'src-tauri/tauri*.json', 'src-tauri/capabilities/**') }}
          restore-keys: |
            oats-windows-x64-${{ steps.windows-toolchain.outputs.version }}-

      # NSIS is the consumer/updater channel; the MSI ships only as a direct
      # GitHub Release asset for internal deployment. Both are built here so the
      # signed path is a drop-in replacement for the unsigned one — the publish
      # script requires an MSI in the handoff.
      - name: Build and Authenticode-sign x64 NSIS and MSI installers
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ vars.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          ./scripts/build-windows-installers.ps1 `
            -Bundles nsis,msi `
            -Target x86_64-pc-windows-msvc `
            -TauriConfig $env:TAURI_WINDOWS_RELEASE_CONFIG

      - name: Verify final installers and installed Authenticode payloads
        shell: pwsh
        run: |
          $bundleRoot = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $nsis = @(Get-ChildItem "$bundleRoot/nsis" -Filter *.exe -File)
          $msi = @(Get-ChildItem "$bundleRoot/msi" -Filter *.msi -File)
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) {
            throw "Expected exactly one signed NSIS and one signed MSI; found NSIS=$($nsis.Count), MSI=$($msi.Count)."
          }

          # The audit-backed deep verification only understands the NSIS
          # payload, so assert the MSI's own signature explicitly.
          $msiSignature = Get-AuthenticodeSignature -LiteralPath $msi[0].FullName
          if ($msiSignature.SignatureType -ne "Authenticode" -or $msiSignature.Status -ne "Valid") {
            throw "MSI is not validly Authenticode-signed: $($msiSignature.Status)"
          }

          ./scripts/verify-windows-authenticode.ps1 `
            -InstallerPath $nsis[0].FullName `
            -SigningAuditPath $env:OATS_SIGNING_AUDIT_PATH

          ./scripts/verify-windows-installer-runtime.ps1 `
            -NsisInstallerPath $nsis[0].FullName `
            -MsiInstallerPath $msi[0].FullName

      # After the verify step, not before it: `failure()` means "an earlier step
      # failed", so sitting above the verify left a signed-but-unverifiable
      # installer with no diagnostics printed at all.
      - name: Show secret-scrubbed signing diagnostics
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:OATS_SIGNING_DIAGNOSTIC_PATH) {
            Get-Content -LiteralPath $env:OATS_SIGNING_DIAGNOSTIC_PATH
          } else {
            Write-Output "The signer produced no safe diagnostic record."
          }

      # Records only path, filename, kind, sha256 and certificate subject — no
      # credentials. Without it, "audit is missing the <X>" cannot be diagnosed
      # because the records that WERE written are invisible.
      - name: Upload Tauri signCommand audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-signing-audit
          if-no-files-found: warn
          retention-days: 1
          path: ${{ env.OATS_SIGNING_AUDIT_PATH }}

      # Same artifact name as the unsigned job: only one of the two ever runs,
      # so sign-windows-updater downloads `windows-installers` either way.
      - name: Upload Authenticode-signed Windows installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-installers
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  package-windows:
    name: Build unsigned x64 NSIS and MSI installers
    # The escape hatch for shipping while eSigner is down. Mutually exclusive
    # with the Authenticode job above, and uploads the same artifact name so the
    # rest of the pipeline is identical either way.
    if: ${{ !inputs.sign }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # `tag` is free-form dispatch input that becomes a checkout ref and, later,
      # an R2 path component. Reject anything that is not a release tag before it
      # reaches either.
      - name: Validate release tag input
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]]; then
            echo "Refusing to build '$TAG': expected a release tag like v0.18.0." >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          cache: 'npm'
          node-version: '24'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Fingerprint Windows Rust toolchain
        id: windows-toolchain
        shell: pwsh
        run: |
          $version = (rustc --version).Replace(' ', '-')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Cache Windows sidecar and executable resources
        id: windows-sidecar-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            src-tauri/binaries/ariso-stt-x86_64-pc-windows-msvc.exe
            src-tauri/binaries/llama
            src-tauri/binaries/windows-runtime
          key: ariso-stt-windows-x64-${{ steps.windows-toolchain.outputs.version }}-${{ hashFiles('src-tauri/ariso-stt/windows/Cargo.lock', 'src-tauri/ariso-stt/windows/Cargo.toml', 'src-tauri/ariso-stt/windows/src/**', 'src-tauri/ariso-stt/shared/**', 'scripts/build-windows-sidecar.ps1', 'scripts/prepare-windows-llama-runtime.ps1', 'scripts/prepare-windows-vc-runtime.ps1', 'scripts/import-windows-build-env.ps1') }}

      - name: Build Windows sidecar and executable resources
        if: steps.windows-sidecar-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-windows-sidecar.ps1

      - name: Verify app-local Visual C++ runtime
        shell: pwsh
        run: |
          ./scripts/verify-windows-vc-runtime.ps1 `
            -RootRuntimeDirectory src-tauri/binaries/windows-runtime `
            -LlamaRuntimeDirectory src-tauri/binaries/llama `
            -SidecarPath src-tauri/binaries/ariso-stt-x86_64-pc-windows-msvc.exe `
            -LlamaServerPath src-tauri/binaries/llama/llama-server.exe

      - name: Cache Windows Rust release dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/x86_64-pc-windows-msvc
          key: oats-windows-x64-${{ steps.windows-toolchain.outputs.version }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/build.rs', 'src-tauri/src/**', 'src-tauri/tauri*.json', 'src-tauri/capabilities/**') }}
          restore-keys: |
            oats-windows-x64-${{ steps.windows-toolchain.outputs.version }}-

      # Intentionally omit the SSL.com signing overlay. The build helper also
      # disables Tauri updater artifacts until the final NSIS bytes are signed
      # separately by sign-windows-updater.
      - name: Build unsigned x64 NSIS and MSI installers
        shell: pwsh
        run: |
          ./scripts/build-windows-installers.ps1 `
            -Bundles nsis,msi `
            -Target x86_64-pc-windows-msvc

      - name: Validate unsigned installer outputs
        shell: pwsh
        run: |
          $nsis = @(
            Get-ChildItem `
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis `
              -Filter *.exe `
              -File
          )
          $msi = @(
            Get-ChildItem `
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi `
              -Filter *.msi `
              -File
          )
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) {
            throw "Expected exactly one unsigned NSIS and one unsigned MSI; found NSIS=$($nsis.Count), MSI=$($msi.Count)."
          }
          foreach ($installer in @($nsis[0], $msi[0])) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($signature.SignatureType -ne "None") {
              throw "Expected unsigned installer '$($installer.Name)', found $($signature.SignatureType)."
            }
          }

          ./scripts/verify-windows-installer-runtime.ps1 `
            -NsisInstallerPath $nsis[0].FullName `
            -MsiInstallerPath $msi[0].FullName

      - name: Upload unsigned Windows installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-installers
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  sign-windows-updater:
    name: Sign and verify the Windows NSIS updater artifact
    # Exactly one packaging job runs, so depend on both and proceed when either
    # succeeded. Without the explicit `if`, a skipped `needs` would skip this
    # job too — which is precisely how defaulting `sign` to true would otherwise
    # publish nothing while the run still reported success.
    needs: [package-windows, package-windows-authenticode]
    if: >-
      ${{ !cancelled()
      && (needs.package-windows.result == 'success'
      || needs.package-windows-authenticode.result == 'success') }}
    runs-on: windows-latest
    # The updater key is deliberately available only after the packaging job has
    # completed and uploaded its immutable bytes.
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          cache: 'npm'
          node-version: '24'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Download Windows installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: windows-installers
          path: artifacts/windows

      - name: Generate updater signature from final installer bytes
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $installers = @(Get-ChildItem artifacts/windows -Filter *.exe -File -Recurse)
          $msi = @(Get-ChildItem artifacts/windows -Filter *.msi -File -Recurse)
          if ($installers.Count -ne 1 -or $msi.Count -ne 1) {
            throw "Expected exactly one NSIS and one MSI installer; found NSIS=$($installers.Count), MSI=$($msi.Count)."
          }
          $installer = $installers[0].FullName
          $before = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash

          ./node_modules/.bin/tauri.cmd signer sign $installer
          if ($LASTEXITCODE -ne 0) {
            throw "Tauri updater signer failed."
          }
          $after = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($after -ne $before) {
            throw "Tauri updater signing unexpectedly modified the installer bytes."
          }

          ./scripts/verify-tauri-updater-signature.ps1 -ArtifactPath $installer

          # Flatten both direct-download installers and the NSIS updater
          # signature into one immutable handoff for publish. MSI intentionally
          # has no .sig because it is never referenced by latest.json.
          $releaseDir = New-Item -ItemType Directory -Force artifacts/release
          Copy-Item -LiteralPath $installer -Destination $releaseDir
          Copy-Item -LiteralPath "$installer.sig" -Destination $releaseDir
          Copy-Item -LiteralPath $msi[0].FullName -Destination $releaseDir

      - name: Upload verified Windows release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-release-bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          path: |
            artifacts/release/*.exe
            artifacts/release/*.exe.sig
            artifacts/release/*.msi

  publish-windows:
    name: Publish Windows artifacts to R2
    needs: sign-windows-updater
    # `skip_publish` stops here: the run still leaves a fully signed, verified
    # installer on the `windows-release-bundle` artifact for inspection.
    if: ${{ !inputs.skip_publish }}
    # Linux, not macOS: this job only downloads an artifact and talks to R2, and
    # the hosted Ubuntu image already ships bash 5, jq, and the AWS CLI.
    runs-on: ubuntu-latest
    # The R2 credentials live in the `release` environment alongside the Apple
    # signing secrets (see CONTRIBUTING → One-time setup in the repo).
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ inputs.ref || inputs.tag }}

      - name: Download verified Windows release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: windows-release-bundle
          path: artifacts/windows

      # The updater manifest carries the release notes, and this workflow has no
      # `release` event payload to read them from, so read them back off the
      # Release that release-please created.
      - name: Fetch release metadata
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          {
            echo "name=$(gh release view "$TAG" --json name --jq '.name')"
            echo "body<<RELEASE_BODY_EOF"
            gh release view "$TAG" --json body --jq '.body'
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Windows artifacts and manifest to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_BODY: ${{ steps.rel.outputs.body }}
          RELEASE_NAME: ${{ steps.rel.outputs.name }}
        run: .github/scripts/release-publish-windows.sh

      # The MSI never reaches R2 or the updater manifest; a GitHub Release asset
      # is the only place it is published. Re-dispatching overwrites the existing
      # assets in place, so this step is not guarded like the body edit below.
      - name: Attach Windows installers to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          fail_on_unmatched_files: true
          files: |
            artifacts/windows/*.exe
            artifacts/windows/*.exe.sig
            artifacts/windows/*.msi

      # Appended separately from the macOS download line: either platform may
      # finish first, and either may fail without the other. `steps.rel` read the
      # body before this run touched it, and only this workflow ever writes the
      # Windows line, so its absence there means the line is genuinely missing —
      # without this guard every re-dispatch would append a duplicate.
      - name: Check whether the Release already links the installer
        id: link
        env:
          BODY: ${{ steps.rel.outputs.body }}
        run: |
          if [[ "$BODY" == *"oats-windows-x86_64.exe"* ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Add Windows download link to GitHub Release
        if: ${{ steps.link.outputs.needed == 'true' }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          append_body: true
          body: |

            **Windows** — [Download x64 installer](https://pub-dd2807d512d34e55b8a863f675ea8e6e.r2.dev/desktop/oats-windows-x86_64.exe)
