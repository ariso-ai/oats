name: Release

# macOS only. Windows packaging lives in release-windows.yaml, dispatched from
# the `dispatch-windows` job below, so an eSigner/Authenticode failure can never
# hold back a macOS build that already signed and notarized.
on:
  push:
    branches:
      - main

permissions:
  contents: read

# Queue runs instead of overlapping: two concurrent release-please runs can
# race on the release PR, and never cancel an in-flight release build — it may
# be signing/notarizing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      prs: ${{ steps.release.outputs.prs }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          # The default GITHUB_TOKEN is sufficient: the macOS release/publish
          # jobs run in THIS workflow run (gated on releases_created), so we
          # don't rely on the published Release firing a separate workflow — the
          # one thing the default token can't do. Windows runs in its own
          # workflow, but it is reached by workflow_dispatch, which the default
          # token IS allowed to trigger. Creating the Release itself needs only
          # contents: write.
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  # release-please only stamps the version into files declared in its config;
  # it can't regenerate lockfiles. The release job builds with `cargo build
  # --locked`, which fails if Cargo.lock disagrees with Cargo.toml's version,
  # so sync both lockfiles on the release PR branch. Neither command compiles
  # anything (no sidecar binary needed). Pushing with the default token does not
  # re-trigger the PR's validate check, which is fine — `main` has no required
  # checks, and the synced lockfiles are exercised by the release job's
  # `cargo build --locked` after the PR merges.
  sync-lock:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout release-please PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ fromJson(needs.release-please.outputs.prs)[0].headBranchName }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Sync package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Sync Cargo.lock
        working-directory: src-tauri
        run: cargo update --workspace

      - name: Commit and push lockfiles if changed
        run: |
          if git diff --quiet package-lock.json src-tauri/Cargo.lock; then
            echo "lockfiles unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          git commit -m "chore: sync lockfiles for release"
          git push

  # Kick off the Windows pipeline as a sibling of the macOS one, not a
  # dependent: neither waits on the other, and neither can fail the other.
  # workflow_dispatch is one of the two events the default GITHUB_TOKEN is
  # allowed to trigger, so this needs no PAT. --ref main (not the tag) because
  # the `release`/`windows-release` environments restrict deployments to the
  # protected main branch; release-windows.yaml checks out the tag itself.
  #
  # Its own job rather than a step on release-please: that job holds
  # contents+pull-requests write on every push to main, and dispatching is the
  # only thing here that needs actions: write.
  dispatch-windows:
    name: Dispatch the Windows release workflow
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # `gh workflow run` exits 0 on accept and prints nothing, so without the
      # summary below a Windows-less release looks identical to a complete one.
      - name: Trigger release-windows.yaml for the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        # --raw-field, not --field: the latter treats a leading '@' as a file
        # reference. Tags never start with '@', but the literal form is correct.
        run: |
          # Recorded before the dispatch so every run we accept below was
          # created by it. Polling for the newest workflow_dispatch run
          # unconditionally would return a PREVIOUS dispatch of the same
          # workflow whenever ours has not been created yet, and the loop would
          # stop on it — linking the summary to a stale run, which is the exact
          # failure the summary exists to prevent.
          DISPATCHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # sign/skip_publish are passed explicitly even though these are the
          # workflow's declared defaults. This is the release path: it must
          # always Authenticode-sign AND publish to R2, so the intent belongs in
          # the call rather than in a default another edit could flip.
          gh workflow run release-windows.yaml --ref main \
            --raw-field tag="$TAG" \
            --raw-field sign=true \
            --raw-field skip_publish=false

          # Dispatch is asynchronous; give the run a moment to appear so the
          # summary can link straight to it. Never fail the release over this —
          # the dispatch itself already succeeded.
          for _ in 1 2 3 4 5 6; do
            sleep 5
            URL="$(gh run list --workflow release-windows.yaml \
              --event workflow_dispatch --limit 20 --json url,createdAt \
              | jq -r --arg since "$DISPATCHED_AT" \
                '[.[] | select(.createdAt >= $since)] | .[0].url // empty' || true)"
            [[ -n "$URL" ]] && break
          done
          {
            echo "### Windows release"
            echo
            echo "Dispatched \`release-windows.yaml\` for \`${TAG}\`: ${URL:-see the Actions tab}"
            echo
            echo "macOS does not wait on it. If it fails, fix and re-dispatch the same tag."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Sign, notarize, and bundle
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    # The `release` environment holds the Apple signing/notarization secrets.
    # Configure its required-reviewer rule before shipping (see CONTRIBUTING).
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          cache: 'npm'
          node-version: '24'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-aarch64-apple-darwin-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-aarch64-apple-darwin-

      - name: Install dependencies
        run: npm ci --prefer-offline

      # The sidecar artifacts (Metal/MLX) are toolchain-specific, and this cache
      # is shared with desktop.yaml's validate job. Key it on the Xcode toolchain
      # so a sidecar built by another runner's Xcode (e.g. desktop.yaml's
      # GitHub-hosted macos-15) is never restored into this signed/notarized build.
      - name: Fingerprint Xcode toolchain
        id: toolchain
        run: echo "fp=$(xcodebuild -version | tr '\n ' '-_')" >> "$GITHUB_OUTPUT"

      # The sidecar is a gitignored build artifact that `tauri:build` (via
      # externalBin) needs present before bundling. The artifact cache (keyed on
      # Package.resolved + Sources/ + toolchain fingerprint) is shared with
      # desktop.yaml's validate job, so this usually restores instantly. On a
      # miss, a single xcodebuild emits both the executable and the MLX metallib
      # bundle (mlx-swift_Cmlx.bundle): without the bundle the notes (LLM) backend
      # fails at runtime with "Failed to load the default metallib", and
      # bundle.resources ships it into the .app. `swift build` is redundant (it
      # can't compile MLX's Metal shaders), so build once with xcodebuild and
      # copy both products out.
      - name: Cache ariso-stt sidecar artifacts
        id: sidecar-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            src-tauri/binaries/ariso-stt-aarch64-apple-darwin
            src-tauri/binaries/mlx-swift_Cmlx.bundle
          key: ariso-stt-aarch64-${{ steps.toolchain.outputs.fp }}-${{ hashFiles('src-tauri/ariso-stt/macos/Package.resolved', 'src-tauri/ariso-stt/macos/Sources/**') }}

      - name: Build ariso-stt sidecar
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        working-directory: src-tauri/ariso-stt/macos
        run: |
          mkdir -p ../../binaries
          xcodebuild build -scheme ariso-stt -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .xcode -skipMacroValidation
          cp .xcode/Build/Products/Release/ariso-stt ../../binaries/ariso-stt-aarch64-apple-darwin
          cp -R .xcode/Build/Products/Release/mlx-swift_Cmlx.bundle ../../binaries/

      - name: Build, sign, and notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --bundles app -- --features prod-api

      # Compose the public DMG after the signed app bundle exists. appdmg
      # writes Finder metadata without needing Finder or AppleScript in CI.
      - name: Compose DMG layout
        run: npm run dmg:compose

      # The composer writes DMG metadata after Tauri signs the .app, so sign,
      # notarize, and staple the final DMG before it becomes the public artifact.
      - name: Sign and notarize composed DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for required_var in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!required_var:-}" ]]; then
              echo "${required_var} is required to sign and notarize the composed DMG." >&2
              exit 1
            fi
          done

          DMG_DIR="src-tauri/target/release/bundle/dmg"
          DMG_COUNT="$(find "${DMG_DIR}" -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')"
          if [[ "${DMG_COUNT}" != "1" ]]; then
            echo "Expected exactly 1 DMG in ${DMG_DIR}, found ${DMG_COUNT}." >&2
            find "${DMG_DIR}" -maxdepth 1 -type f -name '*.dmg' -print >&2
            exit 1
          fi

          DMG="$(find "${DMG_DIR}" -maxdepth 1 -type f -name '*.dmg' -print)"
          codesign --force --sign "${APPLE_SIGNING_IDENTITY}" --timestamp "${DMG}"
          codesign --verify --verbose=4 "${DMG}"
          xcrun notarytool submit "${DMG}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          xcrun stapler staple "${DMG}"
          xcrun stapler validate "${DMG}"

      # Hand the bundler outputs to the publish job. Paths share the common
      # ancestor bundle/, so the artifact preserves the macos/ and dmg/
      # subdirectories that release-publish-macos.sh expects. The DMG and tarball are
      # already compressed, so skip recompression.
      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          path: |
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/dmg/*.dmg

  publish:
    name: Publish macOS artifacts to R2
    needs: [release-please, release]
    runs-on: macos-15
    # The R2 credentials live in the `release` environment alongside the Apple
    # signing secrets (see CONTRIBUTING → One-time setup in the repo).
    environment: release
    permissions:
      contents: write
      # publish-homebrew-cask.sh opens a PR with the cask checksum update
      # instead of pushing to the protected main branch.
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-bundle
          path: src-tauri/target/release/bundle

      # The release name/body are no longer delivered via a `release` event
      # payload, so read them back off the Release that release-please created.
      - name: Fetch release metadata
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          {
            echo "name=$(gh release view "$TAG" --json name --jq '.name')"
            echo "body<<RELEASE_BODY_EOF"
            gh release view "$TAG" --json body --jq '.body'
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # The publish scripts use `mapfile`, a bash 4.0+ builtin. The hosted
      # macos-15 runner's system bash is 3.2, so install a modern bash from
      # Homebrew and run them with it explicitly (the full path in the steps
      # below overrides each script's `#!/usr/bin/env bash` shebang).
      - name: Install modern bash
        run: brew install bash

      - name: Publish macOS artifacts and manifest to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_BODY: ${{ steps.rel.outputs.body }}
          RELEASE_NAME: ${{ steps.rel.outputs.name }}
        run: /opt/homebrew/bin/bash .github/scripts/release-publish-macos.sh

      - name: Open Homebrew cask checksum PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: /opt/homebrew/bin/bash .github/scripts/publish-homebrew-cask.sh

      # release-windows.yaml appends the Windows line to the same Release body
      # on its own schedule; either platform may finish first, and either may
      # fail without the other, so each owns only its own line.
      - name: Add macOS download links to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          append_body: true
          body: |

            ---
            **macOS** — [Download DMG](https://pub-dd2807d512d34e55b8a863f675ea8e6e.r2.dev/desktop/oats.dmg)

            **Homebrew:** `brew tap ariso-ai/oats https://github.com/ariso-ai/oats && brew trust ariso-ai/oats && brew install --cask oats`
