name: release

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Queue runs instead of overlapping: two concurrent release-please runs can
# race on the release PR, and never cancel an in-flight release build — it may
# be signing/notarizing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      prs: ${{ steps.release.outputs.prs }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          # The default GITHUB_TOKEN is sufficient: the release/publish jobs run
          # in THIS workflow run (gated on releases_created), so we don't rely on
          # the published Release firing a separate workflow — the one thing the
          # default token can't do. Creating the Release itself needs only
          # contents: write.
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  # release-please only stamps the version into files declared in its config;
  # it can't regenerate lockfiles. The release job builds with `cargo build
  # --locked`, which fails if Cargo.lock disagrees with Cargo.toml's version,
  # so sync both lockfiles on the release PR branch. Neither command compiles
  # anything (no sidecar binary needed). Pushing with the default token does not
  # re-trigger the PR's validate check, which is fine — `main` has no required
  # checks, and the synced lockfiles are exercised by the release job's
  # `cargo build --locked` after the PR merges.
  sync-lock:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout release-please PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ fromJson(needs.release-please.outputs.prs)[0].headBranchName }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Sync package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Sync Cargo.lock
        working-directory: src-tauri
        run: cargo update --workspace

      - name: Commit and push lockfiles if changed
        run: |
          if git diff --quiet package-lock.json src-tauri/Cargo.lock; then
            echo "lockfiles unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          git commit -m "chore: sync lockfiles for release"
          git push

  release:
    name: Sign, notarize, and bundle
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    # The `release` environment holds the Apple signing/notarization secrets.
    # Configure its required-reviewer rule before shipping (see CONTRIBUTING).
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          cache: 'npm'
          node-version: '24'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-aarch64-apple-darwin-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-aarch64-apple-darwin-

      - name: Install dependencies
        run: npm ci --prefer-offline

      # The sidecar artifacts (Metal/MLX) are toolchain-specific, and this cache
      # is shared with desktop.yaml's validate job. Key it on the Xcode toolchain
      # so a sidecar built by another runner's Xcode (e.g. desktop.yaml's
      # GitHub-hosted macos-15) is never restored into this signed/notarized build.
      - name: Fingerprint Xcode toolchain
        id: toolchain
        run: echo "fp=$(xcodebuild -version | tr '\n ' '-_')" >> "$GITHUB_OUTPUT"

      # The sidecar is a gitignored build artifact that `tauri:build` (via
      # externalBin) needs present before bundling. The artifact cache (keyed on
      # Package.resolved + Sources/ + toolchain fingerprint) is shared with
      # desktop.yaml's validate job, so this usually restores instantly. On a
      # miss, a single xcodebuild emits both the executable and the MLX metallib
      # bundle (mlx-swift_Cmlx.bundle): without the bundle the notes (LLM) backend
      # fails at runtime with "Failed to load the default metallib", and
      # bundle.resources ships it into the .app. `swift build` is redundant (it
      # can't compile MLX's Metal shaders), so build once with xcodebuild and
      # copy both products out.
      - name: Cache ariso-stt sidecar artifacts
        id: sidecar-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            src-tauri/binaries/ariso-stt-aarch64-apple-darwin
            src-tauri/binaries/mlx-swift_Cmlx.bundle
          key: ariso-stt-aarch64-${{ steps.toolchain.outputs.fp }}-${{ hashFiles('src-tauri/ariso-stt/macos/Package.resolved', 'src-tauri/ariso-stt/macos/Sources/**') }}

      - name: Build ariso-stt sidecar
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        working-directory: src-tauri/ariso-stt/macos
        run: |
          mkdir -p ../../binaries
          xcodebuild build -scheme ariso-stt -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .xcode -skipMacroValidation
          cp .xcode/Build/Products/Release/ariso-stt ../../binaries/ariso-stt-aarch64-apple-darwin
          cp -R .xcode/Build/Products/Release/mlx-swift_Cmlx.bundle ../../binaries/

      - name: Build, sign, and notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --bundles app -- --features prod-api

      # Compose the public DMG after the signed app bundle exists. appdmg
      # writes Finder metadata without needing Finder or AppleScript in CI.
      - name: Compose DMG layout
        run: npm run dmg:compose

      # The composer writes DMG metadata after Tauri signs the .app, so sign,
      # notarize, and staple the final DMG before it becomes the public artifact.
      - name: Sign and notarize composed DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for required_var in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!required_var:-}" ]]; then
              echo "${required_var} is required to sign and notarize the composed DMG." >&2
              exit 1
            fi
          done

          DMG_DIR="src-tauri/target/release/bundle/dmg"
          DMG_COUNT="$(find "${DMG_DIR}" -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')"
          if [[ "${DMG_COUNT}" != "1" ]]; then
            echo "Expected exactly 1 DMG in ${DMG_DIR}, found ${DMG_COUNT}." >&2
            find "${DMG_DIR}" -maxdepth 1 -type f -name '*.dmg' -print >&2
            exit 1
          fi

          DMG="$(find "${DMG_DIR}" -maxdepth 1 -type f -name '*.dmg' -print)"
          codesign --force --sign "${APPLE_SIGNING_IDENTITY}" --timestamp "${DMG}"
          codesign --verify --verbose=4 "${DMG}"
          xcrun notarytool submit "${DMG}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          xcrun stapler staple "${DMG}"
          xcrun stapler validate "${DMG}"

      # Hand the bundler outputs to the publish job. Paths share the common
      # ancestor bundle/, so the artifact preserves the macos/ and dmg/
      # subdirectories that release-publish.sh expects. The DMG and tarball are
      # already compressed, so skip recompression.
      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          path: |
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/dmg/*.dmg

  # Disabled while the project does not have a production Authenticode
  # certificate. Keep this protected SSL.com path intact so it can be restored
  # by replacing the active unsigned package-windows job below.
  package-windows-authenticode:
    name: Authenticode-sign x64 NSIS bundle
    needs: release-please
    if: ${{ false && needs.release-please.outputs.releases_created == 'true' }}
    runs-on: windows-latest
    # SSL.com credentials are isolated from Apple/R2/updater-key credentials.
    # In particular, this job cannot produce a Tauri .sig before Authenticode.
    environment: windows-release
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          cache: 'npm'
          node-version: '24'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Fingerprint Windows Rust toolchain
        id: windows-toolchain
        shell: pwsh
        run: |
          $version = (rustc --version).Replace(' ', '-')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Cache Windows sidecar and executable resources
        id: windows-sidecar-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            src-tauri/binaries/ariso-stt-x86_64-pc-windows-msvc.exe
            src-tauri/binaries/llama
          key: ariso-stt-windows-x64-${{ steps.windows-toolchain.outputs.version }}-${{ hashFiles('src-tauri/ariso-stt/windows/Cargo.lock', 'src-tauri/ariso-stt/windows/Cargo.toml', 'src-tauri/ariso-stt/windows/src/**', 'src-tauri/ariso-stt/shared/**', 'scripts/build-windows-sidecar.ps1', 'scripts/prepare-windows-llama-runtime.ps1', 'scripts/import-windows-build-env.ps1') }}

      - name: Build Windows sidecar and executable resources
        if: steps.windows-sidecar-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-windows-sidecar.ps1

      # Pin the reviewed SSL.com action. This invocation only installs and
      # configures CodeSignTool; Tauri calls our secret-safe wrapper once for
      # every binary through bundle.windows.signCommand.
      - name: Set up SSL.com eSigner CodeSignTool
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b  # v1.3.2
        with:
          command: --version
          environment_name: PROD
          signing_method: v2

      - name: Create Tauri remote-signing overlay
        shell: pwsh
        run: |
          $signer = (Resolve-Path scripts/sign-windows-artifact.ps1).Path
          $configPath = Join-Path $env:RUNNER_TEMP "tauri.windows-release.json"
          $auditPath = Join-Path $env:RUNNER_TEMP "oats-windows-signing-audit.jsonl"
          $diagnosticPath = Join-Path $env:RUNNER_TEMP "oats-windows-signing-diagnostic.log"
          $config = [ordered]@{
            bundle = [ordered]@{
              targets = @("nsis")
              createUpdaterArtifacts = $false
              windows = [ordered]@{
                signCommand = [ordered]@{
                  cmd = "pwsh.exe"
                  args = @(
                    "-NoLogo",
                    "-NoProfile",
                    "-NonInteractive",
                    "-ExecutionPolicy",
                    "Bypass",
                    "-File",
                    $signer,
                    "%1"
                  )
                }
              }
            }
          }
          $config | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $configPath -Encoding utf8
          "TAURI_WINDOWS_RELEASE_CONFIG=$configPath" >> $env:GITHUB_ENV
          "OATS_SIGNING_AUDIT_PATH=$auditPath" >> $env:GITHUB_ENV
          "OATS_SIGNING_DIAGNOSTIC_PATH=$diagnosticPath" >> $env:GITHUB_ENV

      - name: Cache Windows Rust release dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/x86_64-pc-windows-msvc
          key: oats-windows-x64-${{ steps.windows-toolchain.outputs.version }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/build.rs', 'src-tauri/src/**', 'src-tauri/tauri*.json', 'src-tauri/capabilities/**') }}
          restore-keys: |
            oats-windows-x64-${{ steps.windows-toolchain.outputs.version }}-

      - name: Build and Authenticode-sign x64 NSIS installer
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ vars.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          ./scripts/build-windows-installers.ps1 `
            -Bundles nsis `
            -Target x86_64-pc-windows-msvc `
            -TauriConfig $env:TAURI_WINDOWS_RELEASE_CONFIG

      - name: Show secret-scrubbed signing diagnostics
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:OATS_SIGNING_DIAGNOSTIC_PATH) {
            Get-Content -LiteralPath $env:OATS_SIGNING_DIAGNOSTIC_PATH
          } else {
            Write-Output "The signer produced no safe diagnostic record."
          }

      - name: Verify final installer and installed Authenticode payloads
        shell: pwsh
        run: |
          $installers = @(
            Get-ChildItem `
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis `
              -Filter *.exe `
              -File
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one x64 NSIS installer, found $($installers.Count)."
          }
          ./scripts/verify-windows-authenticode.ps1 `
            -InstallerPath $installers[0].FullName `
            -SigningAuditPath $env:OATS_SIGNING_AUDIT_PATH

      - name: Upload Authenticode-signed NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-authenticode-nsis
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  package-windows:
    name: Build unsigned x64 NSIS and MSI installers
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          cache: 'npm'
          node-version: '24'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Fingerprint Windows Rust toolchain
        id: windows-toolchain
        shell: pwsh
        run: |
          $version = (rustc --version).Replace(' ', '-')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Cache Windows sidecar and executable resources
        id: windows-sidecar-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            src-tauri/binaries/ariso-stt-x86_64-pc-windows-msvc.exe
            src-tauri/binaries/llama
          key: ariso-stt-windows-x64-${{ steps.windows-toolchain.outputs.version }}-${{ hashFiles('src-tauri/ariso-stt/windows/Cargo.lock', 'src-tauri/ariso-stt/windows/Cargo.toml', 'src-tauri/ariso-stt/windows/src/**', 'src-tauri/ariso-stt/shared/**', 'scripts/build-windows-sidecar.ps1', 'scripts/prepare-windows-llama-runtime.ps1', 'scripts/import-windows-build-env.ps1') }}

      - name: Build Windows sidecar and executable resources
        if: steps.windows-sidecar-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-windows-sidecar.ps1

      - name: Cache Windows Rust release dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/x86_64-pc-windows-msvc
          key: oats-windows-x64-${{ steps.windows-toolchain.outputs.version }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/build.rs', 'src-tauri/src/**', 'src-tauri/tauri*.json', 'src-tauri/capabilities/**') }}
          restore-keys: |
            oats-windows-x64-${{ steps.windows-toolchain.outputs.version }}-

      # Intentionally omit the SSL.com signing overlay. The build helper also
      # disables Tauri updater artifacts until the final NSIS bytes are signed
      # separately by sign-windows-updater.
      - name: Build unsigned x64 NSIS and MSI installers
        shell: pwsh
        run: |
          ./scripts/build-windows-installers.ps1 `
            -Bundles nsis,msi `
            -Target x86_64-pc-windows-msvc

      - name: Validate unsigned installer outputs
        shell: pwsh
        run: |
          $nsis = @(
            Get-ChildItem `
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis `
              -Filter *.exe `
              -File
          )
          $msi = @(
            Get-ChildItem `
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi `
              -Filter *.msi `
              -File
          )
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) {
            throw "Expected exactly one unsigned NSIS and one unsigned MSI; found NSIS=$($nsis.Count), MSI=$($msi.Count)."
          }
          foreach ($installer in @($nsis[0], $msi[0])) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($signature.SignatureType -ne "None") {
              throw "Expected unsigned installer '$($installer.Name)', found $($signature.SignatureType)."
            }
          }

      - name: Upload unsigned Windows installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-unsigned-installers
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  sign-windows-updater:
    name: Sign and verify unsigned Windows NSIS updater artifact
    needs: [release-please, package-windows]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: windows-latest
    # The updater key is deliberately available only after the remote
    # Authenticode job has completed and uploaded its immutable bytes.
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          cache: 'npm'
          node-version: '24'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Download unsigned Windows installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: windows-unsigned-installers
          path: artifacts/windows

      - name: Generate updater signature from final installer bytes
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $installers = @(Get-ChildItem artifacts/windows -Filter *.exe -File -Recurse)
          $msi = @(Get-ChildItem artifacts/windows -Filter *.msi -File -Recurse)
          if ($installers.Count -ne 1 -or $msi.Count -ne 1) {
            throw "Expected exactly one unsigned NSIS and one unsigned MSI; found NSIS=$($installers.Count), MSI=$($msi.Count)."
          }
          $installer = $installers[0].FullName
          $before = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash

          ./node_modules/.bin/tauri.cmd signer sign $installer
          if ($LASTEXITCODE -ne 0) {
            throw "Tauri updater signer failed."
          }
          $after = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($after -ne $before) {
            throw "Tauri updater signing unexpectedly modified the Authenticode-signed installer."
          }

          ./scripts/verify-tauri-updater-signature.ps1 -ArtifactPath $installer

          # Flatten both direct-download installers and the NSIS updater
          # signature into one immutable handoff for publish. MSI intentionally
          # has no .sig because it is never referenced by latest.json.
          $releaseDir = New-Item -ItemType Directory -Force artifacts/release
          Copy-Item -LiteralPath $installer -Destination $releaseDir
          Copy-Item -LiteralPath "$installer.sig" -Destination $releaseDir
          Copy-Item -LiteralPath $msi[0].FullName -Destination $releaseDir

      - name: Upload verified Windows release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-release-bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          path: |
            artifacts/release/*.exe
            artifacts/release/*.exe.sig
            artifacts/release/*.msi

  publish:
    name: Generate manifest and publish artifacts to R2
    needs: [release-please, release, sign-windows-updater]
    runs-on: macos-15
    # The R2 credentials live in the `release` environment alongside the Apple
    # signing secrets (see CONTRIBUTING → One-time setup in the repo).
    environment: release
    permissions:
      contents: write
      # publish-homebrew-cask.sh opens a PR with the cask checksum update
      # instead of pushing to the protected main branch.
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-bundle
          path: src-tauri/target/release/bundle

      - name: Download verified Windows release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: windows-release-bundle
          path: src-tauri/target/release/bundle/windows

      # The release name/body are no longer delivered via a `release` event
      # payload, so read them back off the Release that release-please created.
      - name: Fetch release metadata
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          {
            echo "name=$(gh release view "$TAG" --json name --jq '.name')"
            echo "body<<RELEASE_BODY_EOF"
            gh release view "$TAG" --json body --jq '.body'
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # release-publish.sh uses `mapfile`, a bash 4.0+ builtin. The hosted
      # macos-15 runner's system bash is 3.2, so install a modern bash from
      # Homebrew and run the script with it explicitly (the next step's full
      # path overrides the script's `#!/usr/bin/env bash` shebang).
      - name: Install modern bash
        run: brew install bash

      - name: Generate manifest and publish artifacts to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_BODY: ${{ steps.rel.outputs.body }}
          RELEASE_NAME: ${{ steps.rel.outputs.name }}
        run: /opt/homebrew/bin/bash .github/scripts/release-publish.sh

      - name: Open Homebrew cask checksum PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: .github/scripts/publish-homebrew-cask.sh

      - name: Add R2 download link to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/windows/*.exe
            src-tauri/target/release/bundle/windows/*.exe.sig
            src-tauri/target/release/bundle/windows/*.msi
          append_body: true
          body: |

            ---
            **Downloads:** [macOS DMG](https://pub-dd2807d512d34e55b8a863f675ea8e6e.r2.dev/desktop/oats.dmg) · [Windows x64 installer](https://pub-dd2807d512d34e55b8a863f675ea8e6e.r2.dev/desktop/oats-windows-x86_64.exe)

            **Homebrew:** `brew tap ariso-ai/oats https://github.com/ariso-ai/oats && brew trust ariso-ai/oats && brew install --cask oats`
