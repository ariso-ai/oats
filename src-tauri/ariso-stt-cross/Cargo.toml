[package]
name = "ariso-stt"
version = "0.10.0"
edition = "2024"

[dependencies]
anyhow = "1"
bzip2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sherpa-onnx = "1.13.3"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm"] }
tar = "0.4"
ureq = "2"
zip = "4"

[dev-dependencies]
tempfile = "3"
