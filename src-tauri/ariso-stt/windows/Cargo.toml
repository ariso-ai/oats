[package]
name = "ariso-stt"
version = "0.10.0"
edition = "2024"

[[bin]]
name = "ariso-stt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = "1.13.3"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm"] }
tempfile = "3"
